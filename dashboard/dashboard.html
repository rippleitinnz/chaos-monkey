<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chaos Monkey</title><style>
html{background:#f7f7f4}html.dk{filter:invert(.9) hue-rotate(180deg)}
body{margin:0;color:#3a3f45;font:13px/1.5 monospace}
main{max-width:780px;margin:auto;padding:16px}h1{margin:0;font-size:19px}
button{float:right}
p{color:#555}.y{color:#d4a017}.k,.g{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(115px,1fr))}
.k div,.g div{background:#fff;border:1px solid #ddd;border-radius:7px;padding:6px 8px}
.k b{display:block;font-size:23px;color:#111}.r b,.b{color:#c62828}
#s{height:6px;border-radius:3px;background:#d4a017;overflow:hidden;margin:8px 0}#s i{display:block;height:100%;background:#2e9e4f}
h2{font-size:11px;color:#888;font-weight:400}
.g div{font-size:11px;opacity:.35}.g b{float:right}.g .h{opacity:1}.g .p{border-color:#2e9e4f}.g .f{border-color:#d4a017}.g .x{border-color:#c62828;background:#fdecec}
#e div{border-bottom:1px solid #eee}.o{color:#2e9e4f}
</style></head><body><main><button onclick="document.documentElement.classList.toggle('dk')">&#9680;</button><h1>Chaos Monkey</h1>
<div><span id=l>connecting</span> &middot; <span id=a></span></div>
<p>Hook wakes every few ledgers, emits a random HTML page via emit() so AppLoader validation runs inside consensus. <b class=o>Green</b>: must pass. <b class=y>Amber</b>: must fail. <b class=b>Red</b>: finding.</p>
<div class=k id=k></div><div id=s><i></i></div><h2>COVERAGE</h2><div class=g id=g></div><h2>LIVE WAKES</h2><div id=e></div><p id=t></p></main><script>
const F="FUZZER",NS="NAMESPACE",
N="clean|2xBOM|VT lead|doctype|htmlx|no html|no /html|/html/|/htmlx|junk|cut UTF8|4097B|FFFE|FFFF|overlong2|overlong3|surrogate|>10FFFF|lone cont|NUL|DEL|VT body|C0 body|C0 lead|/html no>|svg✓|multi✓".split("|"),
C=N.map(_=>0),X=C.slice(),E=[],S=[0,0,0,0,0],Q={},$=i=>document.getElementById(i),z=s=>s.replace(/</g,"&lt;");
let L=0,n=0,w;
const q=(o,f)=>{o.id=++n;Q[n]=f;w.send(JSON.stringify(o))};
const tx=(t,m,l,v)=>{
 if(t.TransactionType=="AccountSet"&&t.AppLoader){if(v||!L)L=t.AppLoader.length/2;return}
 if(!/^(Cron|Invoke)$/.test(t.TransactionType))return;
 const e=(m?.HookExecutions||[]).map(x=>x.HookExecution).find(x=>x.HookReturnString);if(!e)return;
 const f=parseInt(e.HookReturnCode,16),b=e.HookReturnString.includes("46494E44494E47");/* "FINDING" */
 if(!(f>=0&&f<27))return;C[f]++;if(b)X[f]++;E[v?"unshift":"push"]({l,f,b})};
const st=()=>q({command:"account_namespace",account:F,namespace_id:NS},r=>{
 (r.namespace_entries||[]).forEach(e=>{const d=e.HookStateData;if(d.length==40)S.forEach((_,j)=>S[j]=parseInt(d.substr(j*8,8),16))});R()});
const R=()=>{
 $("k").innerHTML=["Runs","OK pass","OK fail","Findings","Harness err"].map((t,j)=>`<div${j>2&&S[j]?" class=r":""}>${t}<b>${S[j]}</b></div>`).join("");
 $("s").firstChild.style.width=(S[1]+S[2]?100*S[1]/(S[1]+S[2]):50)+"%";
 const P=new Set([0,25,26]);$("g").innerHTML=N.map((t,f)=>`<div class="${C[f]?"h ":""}${X[f]?"x":P.has(f)?"p":"f"}">${z(t)}<b>${C[f]}</b></div>`).join("");
 $("e").innerHTML=E.slice(0,14).map(o=>`<div>#${o.l} ${z(N[o.f])} &rarr; must ${P.has(o.f)?"pass":"fail"} ${o.b?"<b class=b>FINDING</b>":"<b class=o>&#10003;</b>"}</div>`).join("")||"waiting";
 $("t").innerHTML=`Now serving a ${L}-byte test document &middot; <a href="https://pwa.pwapp.xahau-dev.net/${F}" target=_blank>open</a>`};
const go=()=>{w=new WebSocket("wss://pwapp.xahau-dev.net");
 w.onopen=()=>{$("l").className="o";
  q({command:"account_tx",account:F,limit:300},r=>{(r.transactions||[]).forEach(x=>tx(x.tx,x.meta,x.tx.ledger_index));st()});
  q({command:"subscribe",accounts:[F],streams:["ledger"]})};
 w.onmessage=m=>{const d=JSON.parse(m.data);
  if(Q[d.id]){Q[d.id](d.result||{});delete Q[d.id]}
  else if(d.type=="ledgerClosed")$("l").textContent="ledger "+d.ledger_index;
  else if(d.type=="transaction"&&d.validated){tx(d.transaction,d.meta,d.ledger_index,1);st()}};
 w.onclose=()=>{$("l").className="";setTimeout(go,3e3)}};
$("a").textContent=F;go();
</script></body></html>
