<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><title>CM-D</title><style>
html{background:#f7f7f4}html.dk{filter:invert(.9) hue-rotate(180deg)}
body{margin:0;color:#3a3f45;font:12px/1.4 monospace}main{max-width:780px;margin:auto;padding:12px}
h1{margin:0;font-size:17px}button{float:right}
.k,.g{display:grid;gap:3px;grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.k{margin-bottom:4px}.k div,.g div{background:#fff;border:1px solid #ddd;border-left-width:3px;border-radius:4px;padding:3px 5px}
.k b{display:block;font-size:18px}.r b{color:#c62828}
#s{height:4px;background:#eee;overflow:hidden;margin:4px 0}#s i{display:block;height:100%;background:#2e9e4f}
h2{font:10px monospace;color:#888;margin:5px 0 2px}
.g div{font-size:10px;opacity:.35}.g .h{opacity:1}.g b{float:right}.g .x{background:#fdecec;border-color:#c62828}
.ok{color:#2e9e4f}.bd{color:#c62828}
</style></head><body><main>
<button onclick="document.documentElement.classList.toggle('dk')">◐</button>
<h1>Chaos Monkey - Float/STO</h1>
<p><span id=L>…</span> <span id=A></span>
<div class=k id=K></div><div id=s><i></i></div>
<h2>CASES - spec-only</h2><div class=g id=G></div><h2>WAKES</h2><div id=ev></div>
</main><script>
const F="FUZZER",NS="NAMESPACE",C="fo:one|fs:one,adj,pi,ovf,unf|fn:one,pi,bad|fa:two,zero,bad|fm:six,zero|fd:three,dz|fi:one,half,dz|fc:eq,lt,gt,ne,all,bad|ft:one,pi2,dp16,neg,abs|fx:one|fg:neg,pos|fl:100,neg,bad|fr:neg,bad|fq:three,dz|fz:oob,bad|fy:oob,short|sv:oob,ok,trunc,len0,len1|sf:oob,small,miss,ok|sa:oob,small|eg:one|og:none|en:oob,ok|ef:oob,bad|em:rOOB,wOOB,bad".split("|").flatMap(g=>{const[p,s]=g.split(":");return s.split(",").map(x=>p+"."+x)}),N=C.length;
const P=[...new Set(C.map(x=>x.split(".")[0]))],col=x=>`hsl(${P.indexOf(x.split(".")[0])*360/P.length},55%,50%)`;
const H=Array(N).fill(0),B=Array(N).fill(0),X=new Set,EV=[],S=[0,0,0],Q={};
let n=0,w;
const $=i=>window[i];
const q=(o,f)=>{o.id=++n;Q[n]=f;w.send(JSON.stringify(o))};
function tx(t,m,l,lv){if(!/^(Cron|Invoke)$/.test(t?.TransactionType))return;
for(const e of(m?.HookExecutions||[]).map(x=>x.HookExecution)){
if(!e.HookReturnString||e.HookAccount!==F)continue;
const c=parseInt(e.HookReturnCode,16);if(!(c>=0&&c<N))continue;
const x=e.HookReturnString.includes("46494E44");x?B[c]++:H[c]++;EV[lv?"unshift":"push"]({l,c,x});
}
}
function ls(es){X.clear();for(const e of es){const k=e.HookStateKey||"",d=e.HookStateData||"";
if(k.slice(-10)==="5354415453"&&d.length===32){S[0]=parseInt(d.slice(0,8),16);S[1]=parseInt(d.slice(8,16),16);S[2]=parseInt(d.slice(16,24),16)}
else if(k.slice(2,4)==="46"&&d.length===34)X.add(parseInt(k.slice(0,2),16));
}
}
const R=()=>{$("K").innerHTML=["Runs","OK","Findings","Cases hit"].map((t,j)=>`<div${j==2&&S[2]?' class=r':''}>${t}<b>${j<3?S[j]:H.filter((v,i)=>v+B[i]).length+"/"+N}</b></div>`).join("");
const t=S[1]+S[2];$("s").firstChild.style.width=(t?100*S[1]/t:50)+"%";
$("G").innerHTML=C.map((nm,i)=>`<div style="border-left-color:${col(nm)}" class="${H[i]+B[i]?"h":""}${X.has(i)?" x":""}">${i} ${nm}<b>${H[i]+B[i]||""}</b></div>`).join("");
$("ev").innerHTML=EV.slice(0,12).map(o=>`<div>#${o.l} ${o.c} ${C[o.c]} <b class=${o.x?"bd>!":"ok>✓"}</b></div>`).join("");
};
const ns=()=>q({command:"account_namespace",account:F,namespace_id:NS},r=>{ls(r.namespace_entries||[]);R()});
const go=()=>{w=new WebSocket("wss://pwapp.xahau-dev.net");
w.onopen=()=>{$("L").className="ok";
q({command:"account_tx",account:F,limit:400},r=>{
(r.transactions||[]).forEach(x=>tx(x.tx,x.meta,x.tx.ledger_index));
ns()});
q({command:"subscribe",accounts:[F],streams:["ledger"]});
};
w.onmessage=m=>{const d=JSON.parse(m.data);
if(Q[d.id]){Q[d.id](d.result||{});delete Q[d.id]}
else if(d.type==="ledgerClosed")$("L").textContent="L"+d.ledger_index;
else if(d.type==="transaction"&&d.validated){
tx(d.transaction,d.meta,d.ledger_index,1);
ns()}
};
w.onclose=()=>{$("L").className="";setTimeout(go,3e3)}
};
$("A").textContent=F;go();
</script></body></html>
